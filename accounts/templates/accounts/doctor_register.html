{% extends 'base.html' %}
{% block title %}Doctor Registration - HealthCare HMS{% endblock %}
{% block content %}

<div class="page-header animate-in">
    <h1>Doctor Registration</h1>
    <p>Join our network of healthcare professionals</p>
</div>

<div class="form-card wide animate-in animate-in-1">
    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        <div class="form-row">
            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" placeholder="Choose a username" required>
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" placeholder="Enter your email" required>
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>First Name</label>
                <input type="text" name="first_name" placeholder="First name" required>
            </div>
            <div class="form-group">
                <label>Last Name</label>
                <input type="text" name="last_name" placeholder="Last name" required>
            </div>
        </div>
        <div class="form-group">
            <label>Phone Number</label>
            <input type="text" name="phone" placeholder="Enter phone number" required>
        </div>

        <h3 style="margin-bottom:1rem;margin-top:1.5rem;font-size:1.1rem;">Professional Details</h3>
        <div class="form-row">
            <div class="form-group">
                <label>Department</label>
                <select name="department" required>
                    <option value="">Select Department</option>
                    {% for department in departments %}
                    <option value="{{ department.id }}">{{ department.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label>Specialization</label>
                <input type="text" name="specialization" placeholder="e.g. Cardiologist">
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>Qualification</label>
                <input type="text" name="qualification" placeholder="e.g. MBBS, MD">
            </div>
            <div class="form-group">
                <label>Hospital</label>
                <select name="hospital" required>
                    <option value="">Select Hospital</option>
                    {% for hospital in hospitals %}
                    <option value="{{ hospital.id }}">{{ hospital.name }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>Experience (Years)</label>
                <input type="number" name="experience" placeholder="Years of experience">
            </div>
            <div class="form-group">
                <label>Consultation Fee (₹)</label>
                <input type="number" name="consultation_fee" placeholder="Consultation fee">
            </div>
        </div>
        <div class="form-group">
            <label>Profile Photo</label>
            <input type="file" name="photo">
        </div>

        <h3 style="margin-bottom:1rem;margin-top:1.5rem;font-size:1.1rem;">Account Security</h3>
        <div class="form-row">
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password1" placeholder="Create a password" required>
            </div>
            <div class="form-group">
                <label>Confirm Password</label>
                <input type="password" name="password2" placeholder="Confirm password" required>
            </div>
        </div>
        <button type="submit" class="btn btn-primary btn-block btn-lg">
            <i class="fas fa-user-md"></i> Register Doctor
        </button>
    </form>

    <div class="auth-footer">
        Already have an account? <a href="{% url 'login' %}">Login</a>
    </div>
</div>

{% endblock %}
