{% extends 'base.html' %}
{% block title %}{% if editing %}Edit Hospital{% else %}Add Hospital{% endif %} - HealthCare HMS{% endblock %}
{% block content %}

<div class="page-header animate-in">
    <h1><i class="fas fa-{% if editing %}edit{% else %}plus-circle{% endif %}"></i> {% if editing %}Edit Hospital{% else %}Add Hospital{% endif %}</h1>
</div>

<div class="form-card animate-in animate-in-1">
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary btn-block btn-lg">
            <i class="fas fa-save"></i> {% if editing %}Update Hospital{% else %}Save Hospital{% endif %}
        </button>
    </form>
</div>

{% endblock %}
